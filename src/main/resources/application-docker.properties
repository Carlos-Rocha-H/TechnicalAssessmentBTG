spring.application.name=btgpactual

# AWS - Endpoints apuntan a localstack via Docker network
aws.region=us-east-1
aws.dynamodb.endpoint=http://localstack:4566
aws.ses.endpoint=http://localstack:4566
aws.sns.endpoint=http://localstack:4566
aws.ses.from=noreply@btgpactual.com

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

logging.level.org.springframework.web=INFO
logging.level.software.amazon.awssdk=INFO
